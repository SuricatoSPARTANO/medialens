<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Media Lens — Analisi critica dei contenuti</title>


<style>
:root {
  --bg: #0a0a0f;
  --surface: #13131a;
  --surface2: #1a1a24;
  --border: rgba(255,255,255,0.08);
  --border2: rgba(255,255,255,0.14);
  --text: #f0f0f5;
  --muted: #8888a0;
  --hint: #4a4a60;
  --accent: #e94560;
  --accent2: #7c6af7;
  --warn: #f59e0b;
  --ok: #22c55e;
  --info: #38bdf8;
  --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
  --mono: 'SF Mono', 'Monaco', 'Consolas', monospace;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 15px; }
body { background: var(--bg); color: var(--text); font-family: var(--font); min-height: 100vh; }

/* Layout */
.shell { max-width: 900px; margin: 0 auto; padding: 0 20px 80px; }

/* Header */
header { padding: 28px 0 24px; display: flex; align-items: center; gap: 14px; border-bottom: 0.5px solid var(--border); margin-bottom: 28px; }
.logo { width: 40px; height: 40px; background: var(--accent); border-radius: 10px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.logo svg { width: 22px; height: 22px; fill: none; stroke: #fff; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.brand h1 { font-size: 20px; font-weight: 600; letter-spacing: -.02em; }
.brand p { font-size: 13px; color: var(--muted); margin-top: 1px; }
.version { margin-left: auto; font-size: 11px; color: var(--hint); background: var(--surface2); padding: 3px 9px; border-radius: 8px; border: 0.5px solid var(--border); font-family: var(--mono); }

/* API Keys */
.keys-panel { background: var(--surface); border: 0.5px solid var(--border); border-radius: 14px; padding: 18px 20px; margin-bottom: 24px; }
.keys-title { font-size: 12px; font-weight: 500; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; margin-bottom: 14px; }
.keys-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.key-field label { font-size: 12px; color: var(--muted); display: block; margin-bottom: 5px; }
.key-field input { width: 100%; background: var(--surface2); border: 0.5px solid var(--border2); border-radius: 8px; padding: 9px 12px; color: var(--text); font-family: var(--mono); font-size: 12px; outline: none; transition: border-color .15s; }
.key-field input:focus { border-color: var(--accent); }
.key-field input::placeholder { color: var(--hint); }
.keys-note { font-size: 11px; color: var(--hint); margin-top: 10px; }

/* Mode tabs */
.mode-tabs { display: flex; gap: 6px; margin-bottom: 20px; flex-wrap: wrap; }
.mode-tab { padding: 8px 16px; border-radius: 20px; border: 0.5px solid var(--border2); background: var(--surface); color: var(--muted); font-size: 13px; cursor: pointer; display: flex; align-items: center; gap: 6px; transition: all .15s; font-family: var(--font); }
.mode-tab:hover { border-color: rgba(255,255,255,.25); color: var(--text); }
.mode-tab.active { border-color: var(--accent); color: var(--accent); background: rgba(233,69,96,.08); }
.mode-tab .dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }

/* Input area */
.input-panel { background: var(--surface); border: 0.5px solid var(--border); border-radius: 14px; overflow: hidden; margin-bottom: 20px; }
.input-inner { padding: 16px 18px; }
.input-panel textarea { width: 100%; background: transparent; border: none; color: var(--text); font-family: var(--font); font-size: 14px; line-height: 1.6; resize: none; outline: none; min-height: 120px; }
.input-panel textarea::placeholder { color: var(--hint); }
.input-panel input[type=url] { width: 100%; background: transparent; border: none; color: var(--text); font-family: var(--mono); font-size: 13px; outline: none; padding: 4px 0; }
.input-panel input[type=url]::placeholder { color: var(--hint); }
.input-footer { padding: 10px 18px; border-top: 0.5px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
.char-count { font-size: 12px; color: var(--hint); font-family: var(--mono); }
.btn-analyze { background: var(--accent); color: #fff; border: none; border-radius: 8px; padding: 9px 22px; font-size: 14px; font-weight: 500; cursor: pointer; display: flex; align-items: center; gap: 8px; font-family: var(--font); transition: opacity .15s; }
.btn-analyze:hover { opacity: .85; }
.btn-analyze:disabled { opacity: .4; cursor: not-allowed; }
.spinner { width: 14px; height: 14px; border: 2px solid rgba(255,255,255,.3); border-top-color: #fff; border-radius: 50%; animation: spin .7s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* Live mode */
.live-panel { background: var(--surface); border: 0.5px solid var(--border); border-radius: 14px; padding: 20px; margin-bottom: 20px; display: none; }
.live-panel.show { display: block; }
.live-header { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
.live-indicator { width: 10px; height: 10px; border-radius: 50%; background: var(--hint); }
.live-indicator.on { background: var(--ok); animation: pulse 1.2s infinite; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }
.live-status { font-size: 14px; font-weight: 500; }
.live-transcript { background: var(--surface2); border-radius: 8px; padding: 12px 14px; min-height: 80px; font-size: 13px; color: var(--muted); line-height: 1.6; margin-bottom: 14px; font-style: italic; }
.btn-live { padding: 10px 20px; border-radius: 8px; border: 0.5px solid var(--border2); background: var(--surface2); color: var(--text); font-size: 13px; cursor: pointer; font-family: var(--font); transition: all .15s; }
.btn-live:hover { border-color: var(--ok); color: var(--ok); }
.btn-live.stop { border-color: var(--accent); color: var(--accent); }
.live-chunks { display: flex; flex-direction: column; gap: 8px; max-height: 300px; overflow-y: auto; }
.live-chunk { padding: 10px 12px; border-radius: 8px; border-left: 3px solid transparent; background: var(--surface2); font-size: 12px; }
.live-chunk.low { border-left-color: var(--ok); }
.live-chunk.medium { border-left-color: var(--warn); }
.live-chunk.high { border-left-color: var(--accent); }
.chunk-summary { color: var(--text); margin-bottom: 4px; font-weight: 500; }
.chunk-flags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
.chunk-flag { font-size: 11px; padding: 2px 7px; border-radius: 6px; }
.flag-claim { background: rgba(233,69,96,.15); color: #f09595; }
.flag-framing { background: rgba(245,158,11,.15); color: #fcd34d; }
.flag-rhetoric { background: rgba(56,189,248,.15); color: #7dd3fc; }
.flag-bias { background: rgba(124,106,247,.15); color: #c4b5fd; }

/* Results */
.results { display: none; }
.results.show { display: block; }
.scores-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 20px; }
.score-card { background: var(--surface); border: 0.5px solid var(--border); border-radius: 12px; padding: 14px 16px; text-align: center; }
.sc-label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; margin-bottom: 6px; }
.sc-value { font-size: 26px; font-weight: 600; letter-spacing: -.02em; }
.danger { color: var(--accent); }
.warn { color: var(--warn); }
.safe { color: var(--ok); }

.analysis-section { background: var(--surface); border: 0.5px solid var(--border); border-radius: 14px; overflow: hidden; margin-bottom: 10px; }
.as-header { padding: 13px 18px; display: flex; align-items: center; gap: 12px; cursor: pointer; transition: background .15s; }
.as-header:hover { background: var(--surface2); }
.as-icon { width: 32px; height: 32px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 16px; flex-shrink: 0; }
.ic-claims { background: rgba(233,69,96,.12); }
.ic-framing { background: rgba(245,158,11,.12); }
.ic-bias { background: rgba(124,106,247,.12); }
.ic-rhetoric { background: rgba(56,189,248,.12); }
.ic-omissions { background: rgba(34,197,94,.12); }
.as-title { font-size: 14px; font-weight: 500; flex: 1; }
.as-badge { font-size: 11px; padding: 3px 9px; border-radius: 8px; font-weight: 500; }
.bd-danger { background: rgba(233,69,96,.15); color: #f09595; }
.bd-warn { background: rgba(245,158,11,.15); color: #fcd34d; }
.bd-ok { background: rgba(34,197,94,.15); color: #86efac; }
.bd-neutral { background: var(--surface2); color: var(--muted); }
.as-chevron { font-size: 18px; color: var(--hint); transition: transform .2s; }
.as-chevron.open { transform: rotate(180deg); }
.as-body { display: none; padding: 0 18px 16px; border-top: 0.5px solid var(--border); }
.as-body.open { display: block; }
.as-text { font-size: 13px; color: var(--muted); line-height: 1.7; margin-top: 14px; }
.claim-item { margin-top: 10px; padding: 11px 14px; background: var(--surface2); border-radius: 10px; border-left: 3px solid transparent; }
.claim-item.red { border-left-color: var(--accent); }
.claim-item.yellow { border-left-color: var(--warn); }
.claim-item.green { border-left-color: var(--ok); }
.claim-text { font-size: 13px; color: var(--text); font-weight: 500; margin-bottom: 6px; line-height: 1.5; }
.claim-meta { display: flex; align-items: flex-start; gap: 8px; }
.verdict-tag { font-size: 11px; padding: 2px 8px; border-radius: 6px; font-weight: 500; white-space: nowrap; flex-shrink: 0; margin-top: 1px; }
.vt-false { background: rgba(233,69,96,.2); color: #f09595; }
.vt-partial { background: rgba(245,158,11,.2); color: #fcd34d; }
.vt-true { background: rgba(34,197,94,.2); color: #86efac; }
.vt-unverifiable { background: var(--surface); color: var(--muted); border: 0.5px solid var(--border2); }
.claim-expl { font-size: 12px; color: var(--muted); line-height: 1.5; }
.technique-pills { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
.tech-pill { font-size: 12px; padding: 4px 11px; border-radius: 10px; background: var(--surface2); color: var(--muted); border: 0.5px solid var(--border2); }
.omission-item { margin-top: 8px; display: flex; gap: 8px; align-items: flex-start; font-size: 13px; color: var(--muted); line-height: 1.5; }
.omission-item::before { content: "→"; color: var(--ok); flex-shrink: 0; font-weight: 500; }

.verdict-card { background: var(--surface); border: 0.5px solid var(--border2); border-radius: 14px; padding: 20px; margin-bottom: 10px; }
.vc-label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; margin-bottom: 10px; }
.vc-text { font-size: 14px; color: var(--text); line-height: 1.7; }
.vc-advice { margin-top: 14px; padding-top: 14px; border-top: 0.5px solid var(--border); font-size: 13px; color: var(--muted); line-height: 1.6; }
.vc-advice strong { color: var(--info); }

.transcription-box { background: var(--surface2); border-radius: 10px; padding: 12px 14px; margin-top: 12px; font-size: 12px; color: var(--hint); line-height: 1.6; font-style: italic; border: 0.5px solid var(--border); }

/* Error */
.error-box { background: rgba(233,69,96,.1); border: 0.5px solid rgba(233,69,96,.3); border-radius: 10px; padding: 14px 16px; font-size: 13px; color: #f09595; margin-bottom: 16px; display: none; }
.error-box.show { display: block; }

/* Responsive */
@media (max-width: 600px) {
  .scores-grid { grid-template-columns: repeat(2,1fr); }
  .keys-grid { grid-template-columns: 1fr; }
  .mode-tabs { gap: 4px; }
  .mode-tab { padding: 7px 12px; font-size: 12px; }
}
</style>
</head>
<body>
<div class="shell">

<header>
  <div class="logo">
    <svg viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/><line x1="12" y1="2" x2="12" y2="4"/><line x1="12" y1="20" x2="12" y2="22"/></svg>
  </div>
  <div class="brand">
    <h1>Media Lens</h1>
    <p>Analisi critica di contenuti in tempo reale</p>
  </div>
  <span class="version">v1.0</span>
</header>

<div class="keys-panel">
  <div class="keys-title">Chiavi API</div>
  <div class="keys-grid">
    <div class="key-field">
      <label>Anthropic API Key <span style="color:#e94560">*</span></label>
      <input type="password" id="anthropicKey" placeholder="sk-ant-..." />
    </div>
    <div class="key-field">
      <label>OpenAI API Key <span style="color:#888">(per video/audio)</span></label>
      <input type="password" id="openaiKey" placeholder="sk-..." />
    </div>
  </div>
  <div class="keys-note">Le chiavi restano nel tuo browser. Non vengono mai inviate a server terzi.</div>
</div>

<div class="mode-tabs">
  <button class="mode-tab active" data-mode="text" onclick="setMode('text')"><span class="dot"></span>Testo / Post</button>
  <button class="mode-tab" data-mode="url" onclick="setMode('url')"><span class="dot"></span>Link Video</button>
  <button class="mode-tab" data-mode="transcript" onclick="setMode('transcript')"><span class="dot"></span>Trascrizione</button>
  <button class="mode-tab" data-mode="article" onclick="setMode('article')"><span class="dot"></span>Articolo</button>
  <button class="mode-tab" data-mode="live" onclick="setMode('live')"><span class="dot"></span>🔴 Live</button>
</div>

<div class="error-box" id="errorBox"></div>

<!-- Text / Transcript / Article -->
<div id="inputText" class="input-panel">
  <div class="input-inner">
    <textarea id="textInput" placeholder="Incolla qui il testo da analizzare: post social, trascrizione, articolo, testo di un discorso..." rows="6" oninput="updateCharCount()"></textarea>
  </div>
  <div class="input-footer">
    <span class="char-count" id="charCount">0 caratteri</span>
    <button class="btn-analyze" id="analyzeBtn" onclick="analyze()">
      <span id="btnIcon">⟳</span> Analizza
    </button>
  </div>
</div>

<!-- URL -->
<div id="inputUrl" class="input-panel" style="display:none">
  <div class="input-inner">
    <label style="font-size:12px;color:var(--muted);display:block;margin-bottom:8px">YouTube, Instagram Reel, TikTok, podcast...</label>
    <input type="url" id="urlInput" placeholder="https://youtube.com/watch?v=... oppure https://www.instagram.com/reel/..." />
  </div>
  <div class="input-footer">
    <span style="font-size:11px;color:var(--hint)">Richiede OpenAI API Key per la trascrizione</span>
    <button class="btn-analyze" id="analyzeBtnUrl" onclick="analyze()">
      <span id="btnIconUrl">⟳</span> Scarica e analizza
    </button>
  </div>
</div>

<!-- Live -->
<div id="livePanel" class="live-panel">
  <div class="live-header">
    <div class="live-indicator" id="liveIndicator"></div>
    <span class="live-status" id="liveStatus">Premi Start per iniziare l'ascolto</span>
  </div>
  <div class="live-transcript" id="liveTranscript">Il testo trascritto apparirà qui mentre parli...</div>
  <div style="display:flex;gap:10px;margin-bottom:16px">
    <button class="btn-live" id="liveBtn" onclick="toggleLive()">▶ Start ascolto</button>
    <button class="btn-live" onclick="clearLive()" style="opacity:.6">✕ Pulisci</button>
  </div>
  <div class="live-chunks" id="liveChunks"></div>
</div>

<!-- Results -->
<div class="results" id="results">
  <div class="scores-grid" id="scoresGrid"></div>
  <div id="analysisSections"></div>
  <div class="verdict-card" id="verdictCard"></div>
</div>

</div>

<script>
let currentMode = 'text';
let recognition = null;
let isListening = false;
let liveBuffer = '';
let chunkNum = 0;
let liveTimer = null;

function setMode(mode) {
  currentMode = mode;
  document.querySelectorAll('.mode-tab').forEach(t => t.classList.toggle('active', t.dataset.mode === mode));
  document.getElementById('inputText').style.display = ['text','transcript','article'].includes(mode) ? 'block' : 'none';
  document.getElementById('inputUrl').style.display = mode === 'url' ? 'block' : 'none';
  document.getElementById('livePanel').classList.toggle('show', mode === 'live');
  document.getElementById('results').classList.remove('show');
  hideError();
}

function updateCharCount() {
  const l = document.getElementById('textInput').value.length;
  document.getElementById('charCount').textContent = l + ' caratteri';
}

function showError(msg) {
  const el = document.getElementById('errorBox');
  el.textContent = '⚠ ' + msg;
  el.classList.add('show');
}
function hideError() {
  document.getElementById('errorBox').classList.remove('show');
}

function getKeys() {
  return {
    anthropic: document.getElementById('anthropicKey').value.trim(),
    openai: document.getElementById('openaiKey').value.trim()
  };
}

function getScoreClass(v) {
  if (v >= 70) return 'danger';
  if (v >= 40) return 'warn';
  return 'safe';
}

function getBadgeClass(level) {
  const l = (level||'').toLowerCase();
  if (l.includes('alto') || l.includes('grave') || l.includes('forte') || l.includes('molto')) return 'bd-danger';
  if (l.includes('medio') || l.includes('moderato') || l.includes('parzial')) return 'bd-warn';
  if (l.includes('basso') || l.includes('assente') || l.includes('nessun')) return 'bd-ok';
  return 'bd-neutral';
}

function renderResults(data) {
  const scores = [
    { label: 'Claim a rischio', val: data.risk_score_claims },
    { label: 'Framing emotivo', val: data.risk_score_framing },
    { label: 'Bias ideologico', val: data.risk_score_bias },
    { label: 'Retorica manip.', val: data.risk_score_rhetoric }
  ];
  document.getElementById('scoresGrid').innerHTML = scores.map(s =>
    `<div class="score-card"><div class="sc-label">${s.label}</div><div class="sc-value ${getScoreClass(s.val||0)}">${s.val||0}%</div></div>`
  ).join('');

  const sections = [
    {
      icon: '⬤', iconClass: 'ic-claims', title: 'Claim fattuali verificabili',
      badge: data.claims_level, key: 'claims',
      renderBody: () => {
        let h = `<p class="as-text">${data.claims_summary||''}</p>`;
        (data.claims||[]).forEach(c => {
          const cc = c.color==='red'?'red':c.color==='green'?'green':'yellow';
          const vk = c.verdict_key==='false'?'vt-false':c.verdict_key==='true'?'vt-true':c.verdict_key==='partial'?'vt-partial':'vt-unverifiable';
          h += `<div class="claim-item ${cc}"><div class="claim-text">"${c.claim}"</div><div class="claim-meta"><span class="verdict-tag ${vk}">${c.verdict_label}</span><span class="claim-expl">${c.explanation}</span></div></div>`;
        });
        return h;
      }
    },
    {
      icon: '◎', iconClass: 'ic-framing', title: 'Framing emotivo / manipolativo',
      badge: data.framing_level, key: 'framing',
      renderBody: () => {
        let h = `<p class="as-text">${data.framing_analysis||''}</p>`;
        if (data.framing_examples) h += `<div class="claim-item yellow" style="margin-top:10px"><div class="claim-text" style="font-weight:400;font-style:italic">${data.framing_examples}</div></div>`;
        return h;
      }
    },
    {
      icon: '◈', iconClass: 'ic-bias', title: 'Bias politico / ideologico',
      badge: data.bias_level, key: 'bias',
      renderBody: () => {
        let h = `<p class="as-text">${data.bias_analysis||''}</p>`;
        if (data.bias_spectrum) h += `<div class="claim-item yellow" style="margin-top:10px"><div class="claim-text">Posizionamento rilevato</div><div class="claim-expl">${data.bias_spectrum}</div></div>`;
        return h;
      }
    },
    {
      icon: '◉', iconClass: 'ic-rhetoric', title: 'Tecniche retoriche usate',
      badge: data.rhetoric_level, key: 'rhetoric',
      renderBody: () => {
        let h = `<p class="as-text">${data.rhetoric_analysis||''}</p>`;
        if ((data.rhetoric_techniques||[]).length) {
          h += `<div class="technique-pills">${data.rhetoric_techniques.map(t=>`<span class="tech-pill">${t}</span>`).join('')}</div>`;
        }
        return h;
      }
    },
    {
      icon: '◌', iconClass: 'ic-omissions', title: 'Cosa viene omesso',
      badge: data.omissions_level, key: 'omissions',
      renderBody: () => {
        let h = `<p class="as-text">${data.omissions_analysis||''}</p>`;
        (data.omissions||[]).forEach(o => { h += `<div class="omission-item">${o}</div>`; });
        return h;
      }
    }
  ];

  document.getElementById('analysisSections').innerHTML = sections.map((s,i) => `
    <div class="analysis-section">
      <div class="as-header" onclick="toggleSection(${i})">
        <div class="as-icon ${s.iconClass}">${s.icon}</div>
        <span class="as-title">${s.title}</span>
        <span class="as-badge ${getBadgeClass(s.badge)}">${s.badge||'n.d.'}</span>
        <span class="as-chevron" id="chev${i}">▾</span>
      </div>
      <div class="as-body" id="body${i}">${s.renderBody()}</div>
    </div>
  `).join('');

  document.getElementById('verdictCard').innerHTML = `
    <div class="vc-label">Verdetto complessivo</div>
    <div class="vc-text">${data.overall_verdict||''}</div>
    ${data.reader_advice ? `<div class="vc-advice"><strong>Consiglio:</strong> ${data.reader_advice}</div>` : ''}
    ${data.transcription ? `<div class="transcription-box"><strong style="color:var(--muted);font-style:normal">Trascrizione (anteprima):</strong><br>${data.transcription}</div>` : ''}
  `;

  document.getElementById('results').classList.add('show');
  document.getElementById('results').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function toggleSection(i) {
  document.getElementById('body'+i).classList.toggle('open');
  const c = document.getElementById('chev'+i);
  c.classList.toggle('open');
}

async function analyze() {
  hideError();
  const keys = getKeys();
  if (!keys.anthropic) { showError('Inserisci la tua chiave API Anthropic'); return; }

  const isUrl = currentMode === 'url';
  const text = document.getElementById('textInput')?.value?.trim() || '';
  const url = document.getElementById('urlInput')?.value?.trim() || '';

  if (isUrl && !url) { showError('Inserisci un URL valido'); return; }
  if (!isUrl && !text) { showError('Inserisci del testo da analizzare'); return; }
  if (isUrl && !keys.openai) { showError('Per analizzare video serve anche la chiave OpenAI (per la trascrizione audio)'); return; }

  const btn = document.getElementById(isUrl ? 'analyzeBtnUrl' : 'analyzeBtn');
  const iconEl = document.getElementById(isUrl ? 'btnIconUrl' : 'btnIcon');
  btn.disabled = true;
  iconEl.innerHTML = '<div class="spinner"></div>';

  try {
    const body = {
      anthropic_key: keys.anthropic,
      openai_key: keys.openai,
      mode: currentMode,
      text: text,
      url: url
    };
    const resp = await fetch('/api/analyze', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });
    const data = await resp.json();
    if (!resp.ok) throw new Error(data.error || 'Errore sconosciuto');
    renderResults(data);
  } catch(e) {
    showError(e.message);
  } finally {
    btn.disabled = false;
    iconEl.innerHTML = '⟳';
  }
}

// ---- LIVE ----
function toggleLive() {
  if (isListening) stopLive(); else startLive();
}

function startLive() {
  const keys = getKeys();
  if (!keys.anthropic) { showError('Inserisci la chiave API Anthropic prima di iniziare'); return; }

  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SpeechRecognition) { showError('Il tuo browser non supporta il riconoscimento vocale. Usa Chrome o Edge.'); return; }

  recognition = new SpeechRecognition();
  recognition.lang = 'it-IT';
  recognition.continuous = true;
  recognition.interimResults = true;

  recognition.onresult = (e) => {
    let interim = '';
    let final = '';
    for (let i = e.resultIndex; i < e.results.length; i++) {
      if (e.results[i].isFinal) final += e.results[i][0].transcript + ' ';
      else interim += e.results[i][0].transcript;
    }
    if (final) liveBuffer += final;
    document.getElementById('liveTranscript').textContent = liveBuffer + (interim ? '...' + interim : '');
  };

  recognition.onerror = (e) => { if (e.error !== 'no-speech') showError('Errore microfono: ' + e.error); };
  recognition.onend = () => { if (isListening) recognition.start(); };

  recognition.start();
  isListening = true;
  document.getElementById('liveIndicator').classList.add('on');
  document.getElementById('liveStatus').textContent = 'Ascolto in corso...';
  document.getElementById('liveBtn').textContent = '■ Stop';
  document.getElementById('liveBtn').classList.add('stop');

  liveTimer = setInterval(async () => {
    const chunk = liveBuffer.trim();
    if (!chunk || chunk.split(' ').length < 8) return;
    liveBuffer = '';
    chunkNum++;
    await analyzeLiveChunk(chunk, chunkNum, keys.anthropic);
  }, 20000);
}

function stopLive() {
  if (recognition) { recognition.stop(); recognition = null; }
  if (liveTimer) { clearInterval(liveTimer); liveTimer = null; }
  isListening = false;
  document.getElementById('liveIndicator').classList.remove('on');
  document.getElementById('liveStatus').textContent = 'Ascolto fermato';
  document.getElementById('liveBtn').textContent = '▶ Start ascolto';
  document.getElementById('liveBtn').classList.remove('stop');
}

function clearLive() {
  stopLive();
  liveBuffer = '';
  chunkNum = 0;
  document.getElementById('liveTranscript').textContent = 'Il testo trascritto apparirà qui mentre parli...';
  document.getElementById('liveChunks').innerHTML = '';
  document.getElementById('liveStatus').textContent = 'Premi Start per iniziare l\'ascolto';
}

async function analyzeLiveChunk(text, num, anthropicKey) {
  try {
    const resp = await fetch('/api/analyze-live-chunk', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ anthropic_key: anthropicKey, text, chunk_num: num })
    });
    const data = await resp.json();
    if (data.error || !data.flags) return;

    const container = document.getElementById('liveChunks');
    const div = document.createElement('div');
    div.className = `live-chunk ${data.risk_level||'low'}`;

    let flagsHtml = (data.flags||[]).map(f =>
      `<span class="chunk-flag flag-${f.type}" title="${f.note}">${f.text.substring(0,50)}${f.text.length>50?'...':''}</span>`
    ).join('');

    div.innerHTML = `
      <div class="chunk-summary">${data.summary||''} <span style="color:var(--hint);font-size:11px;margin-left:6px">chunk #${num} · rischio ${data.risk_score||0}%</span></div>
      ${flagsHtml ? `<div class="chunk-flags">${flagsHtml}</div>` : ''}
    `;
    container.insertBefore(div, container.firstChild);
  } catch(e) {}
}
</script>
